name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - '_INTERNAL/**'
  pull_request:
    branches: ["**"]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install system dependencies
        run: sudo apt-get install -y libxml2-dev libxslt1-dev
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Tests
        run: pytest tests/

  docker-check:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (no push)
        run: docker build . --file Dockerfile --tag facturx-engine:ci-check
