name: Security Scan

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Scan Base Image (Python 3.11)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'python:3.11-slim'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Set Version
        id: version
        run: echo "value=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: docker build -t facturx-engine:${{ steps.version.outputs.value }} -t facturx-engine:latest .

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'facturx-engine:${{ steps.version.outputs.value }}'
          format: 'cyclonedx'
          output: 'sbom-${{ steps.version.outputs.value }}.json'
          exit-code: '0'
          
      - name: Scan Final Image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'facturx-engine:${{ steps.version.outputs.value }}'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Show Trivy Scan Results (On Failure)
        if: failure()
        run: cat trivy-results.txt || echo "No results file found, check logs above."

      - name: Upload SBOM Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: facturx-engine-sbom
          path: sbom-${{ steps.version.outputs.value }}.json
          retention-days: 5
